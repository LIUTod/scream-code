<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scream Web UI</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --text-dim: #8b949e; --accent: #79eb00;
    --red: #e85454; --blue: #58a6ff; --yellow: #f7e308;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  #status {
    font-size: 12px; color: var(--text-dim); margin-left: auto;
    display: flex; align-items: center; gap: 6px;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  #status.connected .dot { background: var(--accent); }
  #status.reconnecting .dot { background: var(--yellow); animation: pulse 1s infinite; }
  #status.disconnected .dot { background: var(--red); }
  #status.connecting .dot { background: var(--blue); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px 20px; display: flex;
    flex-direction: column; gap: 12px;
  }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .msg.user { background: #1f6feb33; align-self: flex-end; }
  .msg.assistant { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; }
  .msg.assistant pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow-x: auto; margin-top: 6px; }
  .msg.error { background: #e8545433; border: 1px solid var(--red); color: var(--red); }
  .thinking {
    background: #f7e30811; border: 1px solid #f7e30844; border-radius: 8px;
    padding: 8px 12px; font-size: 13px; color: var(--text-dim); font-style: italic;
    align-self: flex-start; max-width: 85%; cursor: pointer;
  }
  .thinking .content { display: none; margin-top: 6px; white-space: pre-wrap; }
  .thinking.expanded .content { display: block; }
  .thinking .label { font-weight: 600; color: var(--yellow); }
  .tool-card {
    background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--blue);
    border-radius: 6px; padding: 8px 12px; font-size: 13px; align-self: flex-start; max-width: 85%;
  }
  .tool-card .name { color: var(--blue); font-weight: 600; }
  .tool-card .args { color: var(--text-dim); margin-top: 4px; white-space: pre-wrap; word-break: break-all; }
  .tool-card .result { margin-top: 6px; padding: 6px 8px; background: var(--bg); border-radius: 4px;
    white-space: pre-wrap; word-break: break-word; font-family: "SF Mono", "Cascadia Code", monospace; font-size: 12px; }
  .tool-card.error { border-left-color: var(--red); }
  .tool-card.error .result { color: var(--red); }
  .approval-overlay {
    position: fixed; inset: 0; background: #000a; display: flex;
    align-items: center; justify-content: center; z-index: 100;
  }
  .approval-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; max-width: 500px; width: 90%;
  }
  .approval-box h3 { margin-bottom: 12px; }
  .approval-box .action { font-family: monospace; background: var(--bg); padding: 8px; border-radius: 6px; margin: 12px 0; }
  .approval-box .buttons { display: flex; gap: 12px; margin-top: 16px; }
  .approval-box button {
    flex: 1; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .btn-approve { background: var(--accent); color: #000; }
  .btn-reject { background: var(--border); color: var(--text); }
  #input-bar {
    border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 8px;
  }
  #input {
    flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text); font-size: 14px; font-family: inherit; resize: none;
    max-height: 200px; min-height: 42px;
  }
  #send, #abort {
    border: none; border-radius: 8px; padding: 0 20px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #send { background: var(--accent); color: #000; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  #abort { background: var(--red); color: #fff; display: none; }
  #abort.visible { display: block; }
</style>
</head>
<body>
<header>
  <h1>■ Scream Web UI</h1>
  <span id="status" class="connecting"><span class="dot"></span><span class="label">connecting...</span></span>
</header>
<div id="messages"></div>

<div id="input-bar">
  <textarea id="input" rows="1" placeholder="给 Scream 发消息... (Enter 发送, Shift+Enter 换行)" autofocus></textarea>
  <button id="send">发送</button>
  <button id="abort">停止</button>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────
const state = {
  seq: 0,
  epoch: 0,
  sessionId: null,
  workDir: '',
  status: 'connecting', // connecting | connected | reconnecting | disconnected
  busy: false,
  messages: [], // { role, content, tools, isError }
  pendingApprovals: new Map(), // id -> { toolName, action, display }
  sentMessageIds: new Set(), // clientMessageIds of prompts sent from this tab
  heartbeatTimer: null,
  reconnectAttempt: 0,
  reconnectTimer: null,
};

const statusEl = document.getElementById('status');
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const abortBtn = document.getElementById('abort');

let ws = null;

// ── Connection ───────────────────────────────────────────────────────
function connect() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

  const isReconnect = state.status === 'reconnecting';
  setStatus('connecting');

  ws = new WebSocket(`ws://${location.host}`);

  ws.onopen = () => {
    setStatus('connected');
    state.reconnectAttempt = 0;
    // Handshake with last known seq/epoch so the server can replay missed durable events.
    send({ type: 'client_hello', lastSeq: state.seq, epoch: state.epoch });
    // Always fetch snapshot on open to recover volatile state and user messages.
    fetchSnapshot();
  };

  ws.onclose = () => {
    clearHeartbeat();
    setStatus('disconnected');
    scheduleReconnect();
  };

  ws.onerror = () => {
    setStatus('reconnecting');
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    handleMessage(msg);
  };
}

function scheduleReconnect() {
  if (state.reconnectTimer) return;
  setStatus('reconnecting');
  state.reconnectAttempt++;
  const delay = Math.min(1000 * 2 ** state.reconnectAttempt, 30000);
  state.reconnectTimer = setTimeout(() => {
    state.reconnectTimer = null;
    connect();
  }, delay);
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ── Heartbeat ─────────────────────────────────────────────────────────
function startHeartbeat(ms) {
  clearHeartbeat();
  state.heartbeatTimer = setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      send({ type: 'ping' });
    }
  }, ms);
}

function clearHeartbeat() {
  if (state.heartbeatTimer) {
    clearInterval(state.heartbeatTimer);
    state.heartbeatTimer = null;
  }
}

// ── Snapshot ──────────────────────────────────────────────────────────
async function fetchSnapshot() {
  if (!state.sessionId) return;
  try {
    const res = await fetch(`/api/v1/sessions/${state.sessionId}/snapshot`);
    if (!res.ok) return;
    const snapshot = await res.json();
    applySnapshot(snapshot);
  } catch {
    // Snapshot is best-effort; durable events will still be replayed via WS.
  }
}

function applySnapshot(snapshot) {
  state.messages = snapshot.messages || [];
  state.pendingApprovals.clear();
  for (const approval of snapshot.pendingApprovals || []) {
    state.pendingApprovals.set(approval.id, approval);
  }
  renderMessages();
  renderApprovals();
  setBusy(snapshot.status?.busy ?? false);
}

// ── Message handling ─────────────────────────────────────────────────
function handleMessage(msg) {
  switch (msg.type) {
    case 'server_hello':
      state.sessionId = msg.sessionId;
      state.workDir = msg.workDir;
      state.epoch = msg.epoch;
      startHeartbeat(msg.heartbeat_ms);
      updateHeader();
      // Fetch snapshot now that we know the session id.
      fetchSnapshot();
      break;
    case 'event':
      if (typeof msg.seq === 'number') state.seq = Math.max(state.seq, msg.seq);
      if (typeof msg.epoch === 'number') state.epoch = msg.epoch;
      onEvent(msg.payload);
      break;
    case 'user_message':
      // Ignore our own prompt; we already rendered it locally for instant feedback.
      if (msg.clientMessageId && state.sentMessageIds.has(msg.clientMessageId)) break;
      state.messages.push({ role: 'user', content: msg.text, tools: [] });
      renderMessages();
      break;
    case 'approval_request':
      state.pendingApprovals.set(msg.id, msg);
      renderApprovals();
      break;
    case 'approval_resolved':
      state.pendingApprovals.delete(msg.id);
      renderApprovals();
      break;
    case 'resync_required':
      // Server told us we are too far behind; drop local state and fetch snapshot.
      state.seq = 0;
      fetchSnapshot();
      break;
    case 'error':
      addError(msg.message);
      break;
  }
}

function onEvent(event) {
  const t = event.type;
  if (t === 'turn.started') {
    setBusy(true);
    // Start a new assistant message bubble.
    state.messages.push({ role: 'assistant', content: '', tools: [] });
    renderMessages();
  } else if (t === 'assistant.delta') {
    const last = lastAssistantMessage();
    if (last) {
      last.content += event.delta;
      updateLastAssistantContent(last.content);
    }
  } else if (t === 'thinking.delta') {
    updateThinking(event.delta);
  } else if (t === 'tool.call.started') {
    const last = lastAssistantMessage();
    if (last) {
      last.tools.push({ toolCallId: event.toolCallId, name: event.name, args: event.args });
      renderMessages();
    }
  } else if (t === 'tool.result') {
    const last = lastAssistantMessage();
    if (last) {
      const tool = last.tools.find(t => t.toolCallId === event.toolCallId);
      if (tool) {
        tool.output = String(event.output);
        tool.isError = event.isError;
      }
      renderMessages();
    }
  } else if (t === 'turn.ended') {
    setBusy(false);
    if (event.reason === 'failed') {
      const last = lastAssistantMessage();
      if (last) last.isError = true;
      addError(event.error?.message ?? 'Turn failed');
    }
    removeThinking();
    renderMessages();
  } else if (t === 'error') {
    addError(event.error?.message ?? 'Unknown error');
  }
}

function lastAssistantMessage() {
  for (let i = state.messages.length - 1; i >= 0; i--) {
    if (state.messages[i].role === 'assistant') return state.messages[i];
  }
  return null;
}

// ── Rendering ─────────────────────────────────────────────────────────
function renderMessages() {
  messagesEl.innerHTML = '';
  for (const msg of state.messages) {
    if (msg.role === 'user') {
      const el = document.createElement('div');
      el.className = 'msg user';
      el.textContent = msg.content;
      messagesEl.appendChild(el);
    } else {
      const el = document.createElement('div');
      el.className = 'msg assistant';
      el.innerHTML = formatAssistantContent(msg.content);
      for (const tool of msg.tools) {
        el.appendChild(renderToolCard(tool));
      }
      messagesEl.appendChild(el);
    }
  }
  scrollDown();
}

function updateLastAssistantContent(text) {
  const assistants = messagesEl.querySelectorAll('.msg.assistant');
  const last = assistants[assistants.length - 1];
  if (last) last.innerHTML = formatAssistantContent(text);
  scrollDown();
}

function formatAssistantContent(text) {
  // Phase 1: minimal formatting; Phase 2 will replace with full Markdown.
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function renderToolCard(tool) {
  const card = document.createElement('div');
  card.className = 'tool-card' + (tool.isError ? ' error' : '');
  card.id = `tool-${tool.toolCallId}`;
  const argsStr = tool.args ? escapeHtml(JSON.stringify(tool.args, null, 2)) : '';
  let html = `<span class="name">🔧 ${escapeHtml(tool.name)}</span>`;
  if (argsStr) html += `<div class="args">${argsStr}</div>`;
  if (tool.output !== undefined) {
    html += `<div class="result">${escapeHtml(truncate(tool.output, 2000))}</div>`;
  }
  card.innerHTML = html;
  return card;
}

let currentThinkingEl = null;

function updateThinking(delta) {
  if (!currentThinkingEl) {
    currentThinkingEl = document.createElement('div');
    currentThinkingEl.className = 'thinking';
    currentThinkingEl.innerHTML = '<span class="label">💭 思考中</span><div class="content"></div>';
    currentThinkingEl.onclick = () => currentThinkingEl.classList.toggle('expanded');
    messagesEl.appendChild(currentThinkingEl);
  }
  const content = currentThinkingEl.querySelector('.content');
  content.textContent += delta;
  scrollDown();
}

function removeThinking() {
  if (currentThinkingEl) {
    currentThinkingEl.remove();
    currentThinkingEl = null;
  }
}

function renderApprovals() {
  // Remove stale overlays for approvals that are no longer pending.
  const existing = new Set(document.querySelectorAll('.approval-overlay[data-id]'));
  for (const overlay of existing) {
    const id = overlay.getAttribute('data-id');
    if (!state.pendingApprovals.has(id)) overlay.remove();
  }
  // Add overlays for new pending approvals.
  for (const [id, approval] of state.pendingApprovals) {
    if (document.querySelector(`.approval-overlay[data-id="${CSS.escape(id)}"]`)) continue;
    const overlay = document.createElement('div');
    overlay.className = 'approval-overlay';
    overlay.setAttribute('data-id', id);
    const actionText = approval.display?.description ?? approval.action ?? 'execute';
    overlay.innerHTML = `
      <div class="approval-box">
        <h3>🔧 ${escapeHtml(approval.toolName)} 请求批准</h3>
        <div class="action">${escapeHtml(actionText)}</div>
        <div class="buttons">
          <button class="btn-reject">拒绝</button>
          <button class="btn-approve">批准</button>
        </div>
      </div>`;
    overlay.querySelector('.btn-approve').onclick = () => resolveApproval(id, 'approved');
    overlay.querySelector('.btn-reject').onclick = () => resolveApproval(id, 'rejected');
    document.body.appendChild(overlay);
  }
}

function resolveApproval(id, decision) {
  state.pendingApprovals.delete(id);
  send({ type: 'approval_response', id, decision });
  renderApprovals();
}

// ── UI helpers ────────────────────────────────────────────────────────
function setStatus(status) {
  state.status = status;
  statusEl.className = status;
  const labels = {
    connecting: 'connecting...',
    connected: 'connected',
    reconnecting: 'reconnecting...',
    disconnected: 'disconnected',
  };
  statusEl.querySelector('.label').textContent = labels[status] ?? status;
}

function updateHeader() {
  if (state.sessionId) {
    statusEl.querySelector('.label').textContent = `session: ${state.sessionId.slice(0, 8)} · ${state.workDir}`;
  }
}

function setBusy(b) {
  state.busy = b;
  sendBtn.disabled = b;
  sendBtn.textContent = b ? '...' : '发送';
  abortBtn.classList.toggle('visible', b);
}

function addError(text) {
  const el = document.createElement('div');
  el.className = 'msg error';
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollDown();
}

function scrollDown() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function truncate(s, max) {
  return s.length > max ? s.slice(0, max) + `\n... (${s.length - max} more chars)` : s;
}

// ── Input ─────────────────────────────────────────────────────────────
function sendPrompt() {
  const text = inputEl.value.trim();
  if (!text || state.busy) return;
  const clientMessageId = `client_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  state.sentMessageIds.add(clientMessageId);
  state.messages.push({ role: 'user', content: text, tools: [] });
  renderMessages();
  send({ type: 'prompt', text, clientMessageId });
  inputEl.value = '';
  inputEl.style.height = 'auto';
}

sendBtn.onclick = sendPrompt;
inputEl.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
};
inputEl.oninput = () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
};

abortBtn.onclick = () => {
  send({ type: 'abort' });
};

// ── Start ─────────────────────────────────────────────────────────────
connect();

// Reconnect when browser comes back online or tab becomes visible.
window.addEventListener('online', () => connect());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.status !== 'connected') connect();
});
</script>
</body>
</html>
