name: agent
description: Default Scream Code agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - LSP
  - TaskList
  - TaskOutput
  - TaskStop
  - CronCreate
  - CronList
  - CronDelete
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - ReadMediaFile
  - TodoList
  - MemoryLookup
  - MemoryConsolidatePlan
  - MemoryConsolidateApply
  - MemoryWrite
  - KnowledgeLookup
  - InspectOwnAssets
  - Skill
  - MakeSkillPlan
  - MakeSkillApply
  # Main-agent capability management. Subagent profiles inherit this list, but
  # the tool is only registered for main agents, so it never reaches their
  # model-visible tool set.
  - ManagePlugin
  - WebSearch
  - Agent
  - SendSubagentMessage
  - WolfPack

  - FetchURL
  - AskUserQuestion
  - EnterPlanMode
  - FusionPlan
  - ExitPlanMode
  - mcp__*

# Routing text for the parent's `Agent` tool: the description is the "what",
# the profile's own `whenToUse` supplies the "call me when / do not call me
# for" triggers. Keep both short and trigger-shaped so all types stay
# comparable when the model picks one. This map is the single source of truth:
# system.md must not restate it.
subagents:
  coder:
    description: Edits files and runs commands for non-trivial engineering work, then reports a compact, technically complete summary.
  explore:
    description: Read-only reconnaissance across files; returns a structured map (summary, inventory, architecture) and never edits.
  plan:
    description: Read-only architect; turns a request into a step-by-step, file-level implementation plan with trade-offs.
  verify:
    description: Runs the project's real gates (build, test, lint, typecheck) and reports pass/fail with raw command evidence.
  reviewer:
    description: Adversarial review of a diff; reports bugs, contract violations and integration risk by severity.
  oracle:
    description: Large-scope review of code that already exists — architecture soundness, tech debt, long-term maintainability, dead or redundant code — with evidence and a concrete fix per finding; does not edit unless asked.
  worker:
    description: Office and document automation worker; format conversion, batch file processing and file organization, and never code or prose.
  writer:
    description: Professional writing and document specialist; drafts, rewrites, translates, summarizes and produces document artifacts.
  designer:
    description: 'Visual-layer specialist: UI/UX/TUI design direction, code-grade specs, screen polish, and design audits.'
