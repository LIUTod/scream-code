name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci-check:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Sherif
        run: pnpm run sherif

      - name: Test
        run: pnpm run test

  ci-check-windows:
    name: Pre-release checks (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      # The RLM kernel tests spawn a real python interpreter (python3 on
      # POSIX, python on Windows). Windows runners do not ship python, so it
      # must be installed explicitly — otherwise the persistent-kernel tests
      # fail with "No python interpreter found".
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root typecheck script depends on workspace package dists
      # (build:packages). pnpm install does not build them (no prepare
      # script), and the ubuntu job passes only because its cache happens to
      # carry the dists — Windows starts cold, so build explicitly.
      - name: Build workspace packages
        run: pnpm run build:packages

      # Windows job verifies the RLM persistent-kernel tests on a real
      # Windows python (spawn python/python3 + pipe REPL + file bridge).
      # Only the RLM tests run here: the rest of the agent-core suite has
      # pre-existing platform-sensitive cases (hook termination, output
      # projection) that are linux-covered; running them on Windows would
      # fail for reasons unrelated to RLM. agent-core has no dependency on
      # the @scream-code/config workspace link, so this job avoids that
      # Windows pnpm resolution quirk too.
      - name: Test (RLM on Windows)
        run: pnpm --filter @scream-code/agent-core exec vitest run test/tools/builtin/python.test.ts test/tools/builtin/rlm-interrupt.test.ts

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [ci-check, ci-check-windows]
    if: github.repository_owner == 'LIUTod'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version:release
          commit: 'ci: release packages'
          title: 'ci: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
