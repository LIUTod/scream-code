name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/scream-code run smoke

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run test:coverage

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run lint
      - run: pnpm run sherif

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck

  # Platform tests.
  #
  # macOS runs on every push and pull request: it is green, and it guards the
  # POSIX paths that differ from the ubuntu jobs.
  #
  # The Windows leg is manual-only (`workflow_dispatch`): no CI run that
  # included this leg has passed, and a push to main must not be gated on it.
  # When it is triggered, the expected failures fall into these
  # known-unfinished categories — none of them
  # a broken product path:
  #   - path spelling: tests that build expectations with the host separator
  #     while the code returns `/`, or the reverse;
  #   - snapshot baselines: inline and file snapshots recorded on Linux,
  #     including whole tool descriptions;
  #   - session wire paths: resume/wire fixtures whose recorded paths differ;
  #   - glob semantics: hidden-entry traversal and result ordering;
  #   - command safety branches: fixtures that assume a POSIX shell is present.
  # Each category is a separate, deliberate change. Until it is done the leg
  # stays manual so a push to main is never gated on it.
  platform-tests:
    name: Platform tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `jobs.<job_id>.if` cannot read the `matrix` context, so the platform
        # list itself is what differs: macOS on every event, Windows only when
        # the workflow is started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest", "windows-latest"]') || fromJSON('["macos-latest"]') }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test platform-sensitive packages
        run: pnpm exec vitest run packages/agent-core packages/jian packages/memory

